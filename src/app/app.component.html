<app-header/>
<main>
    <ul id="users">
        @for (user of users; track user.id) {
            <li>
                <app-user 
                [user]="user"
                [selected]="user.id === selectedUser?.id"
                (select)="onSelectUser($event)"
                />
            </li>
        }
    </ul>
    
    @if (selectedUser) {
        <app-usertask [userId]="selectedUser.id" [name]="selectedUser.name"/>
    } @else {
        <h1 id="@fallback">Select a user to see their tasks</h1>
    }
</main>
