@if(isAddingTask){
    <app-new-task [userId]="userId" (close)="onClose()"/>
}

<section id="tasks">
    <header>
        <h1>{{ name }}'s Tasks</h1>
        <menu>
            <button (click)="onAddTask()">Add Task</button>
        </menu>
    </header>

    <ul>
        @for (task of selectedUserTasks; track task.id) {
            <li>
                <app-tasks [task]="task"/>
            </li>
        }
    </ul>
</section>
